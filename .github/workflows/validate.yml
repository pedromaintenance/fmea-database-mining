name: Validar catálogo FMEA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar catálogo relacional
        run: node scripts/validate.mjs
      - name: Gerar pacotes por modelo
        run: node scripts/generate-models.mjs --all
      - name: Validar combinacões geradas
        run: node scripts/validate.mjs
      - name: Validar biblioteca extraida
        run: node scripts/validate-knowledge.mjs
      - name: Gerar relações preventivas FMEA
        run: npm run pm:generate
      - name: Validar relações preventivas
        run: npm run pm:validate
      - name: Auditar lacunas das regras preventivas
        run: npm run pm:gaps:audit
      - name: Gerar vínculos diagnósticos por modelo
        run: npm run diagnostic:generate
      - name: Validar vínculos, hipóteses e evidências planejadas
        run: npm run diagnostic:validate
      - name: Gerar prévia didática sem gabarito
        run: npm run diagnostic:preview
      - name: Validar ontologia e classificacoes
        run: npm run ontology:validate
      - name: Validar condicoes acoes danos e regressao semantica
        run: npm run semantics:validate
      - name: Validar cadeias causais e fontes
        run: npm run causal:validate
      - name: Validar 24 pares de efeitos locais e sistemicos
        run: npm run effects:validate
      - name: Validar 48 requisitos de evidencia e 24 gates de curadoria
        run: npm run evidence:validate
      - name: Validar capacidade discriminante de seis testes P0
        run: npm run discrimination:validate
      - name: Validar avaliacao cruzada de 24 testes e revisao SAP/OEM
        run: npm run differential:validate
      - name: Validar três roteiros diferenciais e causalidade segregada
        run: npm run pathways:validate
      - name: Validar quatro niveis causais em 24 cadeias
        run: npm run causal:levels:validate
      - name: Gerar preview publico versionado
        run: npm run public:export
      - name: Validar preview publico e checksum
        run: npm run public:validate
      - name: Auditar 24 cadeias contra locais componentes danos e causas SAP
        run: npm run causal:sap:audit
      - name: Gerar relatorio de cobertura e lacunas
        run: npm run quality:audit
      - name: Publicar pacotes para testes
        uses: actions/upload-artifact@v4
        with:
          name: failure-candidates-${{ github.sha }}
          path: |
            data/models/*.json
            data/manifest.json
            data/knowledge/pm-prevention/generated-links.json
            data/knowledge/diagnostic/generated-links.json
            data/knowledge/diagnostic/generated-player-preview.json
            reports/quality-audit.generated.json
            reports/causal-sap-audit.generated.json
            reports/pm-gap-audit.generated.json
            reports/public-knowledge.v1.json
            reports/public-manifest.v1.json
          retention-days: 14
