name: Validar catálogo FMEA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar catálogo relacional
        run: node scripts/validate.mjs
      - name: Gerar pacotes por modelo
        run: node scripts/generate-models.mjs --all
      - name: Validar combinacões geradas
        run: node scripts/validate.mjs
      - name: Validar biblioteca extraida
        run: node scripts/validate-knowledge.mjs
      - name: Gerar relações preventivas FMEA
        run: npm run pm:generate
      - name: Validar relações preventivas
        run: npm run pm:validate
      - name: Auditoria de 25 regras PM, escopo funcional e 24 mutacoes
        run: npm run pm:scope:audit
      - name: Auditar lacunas das regras preventivas
        run: npm run pm:gaps:audit
      - name: Auditar fronteiras HSVV COMR e 23 regressões PM
        run: npm run pm:boundaries:audit
      - name: Identificar candidatos de filtragem por funcao sem homologar SAP OEM
        run: npm run pm:filtration:audit
      - name: Auditar proveniencia de tipos de objeto VPAR sem confundir catalogo e instalacao
        run: npm run pm:vpar:audit
      - name: Auditar matriz de evidencias VPAR por circuito e seguranca da inferencia
        run: npm run pm:vpar:evidence:audit
      - name: Validar 10 bloqueios PM e 7 requisitos de efetividade OEM D9
        run: npm run pm:exceptions:validate
      - name: Gerar vínculos diagnósticos por modelo
        run: npm run diagnostic:generate
      - name: Validar vínculos, hipóteses e evidências planejadas
        run: npm run diagnostic:validate
      - name: Gerar prévia didática sem gabarito
        run: npm run diagnostic:preview
      - name: Validar ontologia e classificacoes
        run: npm run ontology:validate
      - name: Validar condicoes acoes danos e regressao semantica
        run: npm run semantics:validate
      - name: Validar cadeias causais e fontes
        run: npm run causal:validate
      - name: Validar 24 pares de efeitos locais e sistemicos
        run: npm run effects:validate
      - name: Validar 48 requisitos de evidencia e 24 gates de curadoria
        run: npm run evidence:validate
      - name: Validar protocolo de custodia restrita e 29 cenarios sinteticos
        run: npm run evidence:restricted:validate
      - name: Validar arquitetura corporativa e 42 testes sinteticos de seguranca
        run: npm run infrastructure:restricted:validate
      - name: Verificar plano de homologacao de staging e 52 testes sinteticos
        run: npm run staging:acceptance:validate
      - name: Validar contrato de adaptador offline e 56 regressões sinteticas
        run: npm run staging:adapter:validate
      - name: Verificar custodia privada e 48 atestacoes criptograficas sinteticas
        run: npm run custody:results:validate
      - name: Validar triagem de excecoes e 64 historicos sinteticos
        run: npm run staging:exceptions:validate
      - name: Validar catalogo de remediacao e 52 regressoes sinteticas
        run: npm run remediation:recurrence:validate
      - name: Consolidar oito bloqueios com 40 testes sinteticos de procedencia
        run: npm run blockers:validate
      - name: Conferir sete requisicoes D9 e 35 cenarios sinteticos
        run: npm run d9:oem:request:validate
      - name: Validar cinco fontes CAT publicas e 31 regressoes D9
        run: npm run d9:public:oem:validate
      - name: Conferir issue publica D9 e 27 controles de handoff
        run: npm run d9:handoff:validate
      - name: Validar capacidade discriminante de seis testes P0
        run: npm run discrimination:validate
      - name: Validar avaliacao cruzada de 24 testes e revisao SAP/OEM
        run: npm run differential:validate
      - name: Validar três roteiros diferenciais e causalidade segregada
        run: npm run pathways:validate
      - name: Validar tres novos roteiros e 21 regressões diagnosticas
        run: npm run pathways:expand:validate
      - name: Verificar seis playbooks aprofundados e 34 regressões
        run: npm run playbooks:deepdives:validate
      - name: Validar 12 playbooks, crosswalk causal e 46 regressões
        run: npm run playbooks:remaining:validate
      - name: Revisar cinco lacunas e 21 regressões de promoção causal
        run: npm run causal:gaps:validate
      - name: Auditar ontologia de 3 propostas e 18 mutacoes sinteticas
        run: npm run taxonomy:proposals:validate
      - name: Validar conceito de perda interna e 3 submodos de engrenagem
        run: npm run mechanisms:refinements:validate
      - name: Validar quatro niveis causais em 24 cadeias
        run: npm run causal:levels:validate
      - name: Auditar causalidade sistemica em 24 cadeias
        run: npm run systemic:audit:validate
      - name: Gerar preview publico versionado
        run: npm run public:export
      - name: Validar preview publico e checksum
        run: npm run public:validate
      - name: Verificar contrato publico e compatibilidade SemVer
        run: npm run public:compatibility
      - name: Verificar release de conteudo e golden snapshot
        run: npm run public:content:validate
      - name: Testar 17 mutacoes sinteticas de compatibilidade de conteudo
        run: npm run public:content:test
      - name: Auditar 24 cadeias contra locais componentes danos e causas SAP
        run: npm run causal:sap:audit
      - name: Gerar relatorio de cobertura e lacunas
        run: npm run quality:audit
      - name: Publicar pacotes para testes
        uses: actions/upload-artifact@v4
        with:
          name: failure-candidates-${{ github.sha }}
          path: |
            data/models/*.json
            data/manifest.json
            data/knowledge/pm-prevention/generated-links.json
            data/knowledge/diagnostic/generated-links.json
            data/knowledge/diagnostic/generated-player-preview.json
            reports/quality-audit.generated.json
            reports/causal-sap-audit.generated.json
            reports/pm-gap-audit.generated.json
            reports/pm-functional-boundaries.generated.json
            reports/pm-filtration-discovery.generated.json
            reports/pm-vpar-provenance.generated.json
            reports/pm-vpar-evidence-matrix.generated.json
            reports/public-knowledge.v1.json
            reports/public-manifest.v1.json
            data/governance/public-content-releases.v1.json
          retention-days: 14
