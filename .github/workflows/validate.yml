name: Validar catálogo FMEA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar catálogo relacional
        run: node scripts/validate.mjs
      - name: Gerar pacotes por modelo
        run: node scripts/generate-models.mjs --all
      - name: Validar combinacões geradas
        run: node scripts/validate.mjs
      - name: Validar biblioteca extraida
        run: node scripts/validate-knowledge.mjs
      - name: Gerar relações preventivas FMEA
        run: npm run pm:generate
      - name: Validar relações preventivas
        run: npm run pm:validate
      - name: Auditoria de 25 regras PM, escopo funcional e 24 mutacoes
        run: npm run pm:scope:audit
      - name: Auditar lacunas das regras preventivas
        run: npm run pm:gaps:audit
      - name: Auditar fronteiras HSVV COMR e 23 regressões PM
        run: npm run pm:boundaries:audit
      - name: Identificar candidatos de filtragem por funcao sem homologar SAP OEM
        run: npm run pm:filtration:audit
      - name: Auditar proveniencia de tipos de objeto VPAR sem confundir catalogo e instalacao
        run: npm run pm:vpar:audit
      - name: Auditar matriz de evidencias VPAR por circuito e seguranca da inferencia
        run: npm run pm:vpar:evidence:audit
      - name: Auditar triagem semantica radiador e agua no combustivel sem notas SAP
        run: npm run pm:semantic:triage
      - name: Auditar filtro de oleo do motor e candidatos SAP sem homologacao
        run: npm run pm:engine:oilfilter:audit
      - name: Auditar rodante IDLE CTS vedacoes e rolamento sem homologacao
        run: npm run pm:idler:audit
      - name: Auditar ontologia de roda-guia e rolete sem inferencia de falha
        run: npm run pm:idler:semantics:audit
      - name: Auditar coerencia semantica transversal das regras PM sem confundir falha e condicao
        run: npm run pm:semantic:crosswalk:audit
      - name: Auditar modelagem de ventilador e correia e rótulo hipotético do radiador
        run: npm run pm:cooling:fan:audit
      - name: Auditar abrasão de mangueira, armadura exposta e bloqueio HSVV
        run: npm run pm:hose:abrasion:audit
      - name: Auditar fixadores de sapatas, pré-carga e torque-turn com evidência OEM
        run: npm run pm:track:bolt:audit
      - name: Auditar comando final e engrenagem
        run: npm run pm:drive:gear:audit
      - name: Auditar rolamentos do comando final e sinais do redutor
        run: npm run pm:drive:bearing:audit
      - name: Auditar geometria e danos das engrenagens do diferencial
        run: npm run pm:differential:gear:audit
      - name: Auditar cilindro de implemento, deriva e vazamentos sem inferir causa
        run: npm run pm:implement:cylinder:audit
      - name: Auditar arquiteturas de freios e fronteiras de segurança
        run: npm run pm:brake:disc:audit
      - name: Preauditar coletor de escape, fuligem e juntas sem promover diagnostico
        run: npm run pm:exhaust:preflight
      - name: Auditar ontologia do coletor de escape e seguranca causal
        run: npm run pm:exhaust:ontology:audit
      - name: Auditar danos estruturais de pneus OTR e bloqueios de seguranca
        run: npm run pm:tire:damage:audit
      - name: Auditar desgaste de pneus OTR e perfil de RTD
        run: npm run pm:tire:wear:audit
      - name: Auditar corrente de avanco FECH e opcao de tensionamento OEM
        run: npm run pm:drill:feed:audit
      - name: Auditar rolamentos e arquiteturas Sandvik HTRH6 MRH6 DR410i
        run: npm run pm:drill:rotary:audit
      - name: Auditar estanqueidade pneumatica, pressao zero e bloqueio VPAR
        run: npm run pm:drill:pressure:audit
      - name: Auditar filtragem de compressor, funcoes e bloqueio COMR
        run: npm run pm:drill:filter:audit
      - name: Auditar maturidade FMEA de 25 regras e fila de homologacao
        run: npm run pm:maturity:audit
      - name: Validar intake restrito sintetico PM e 40 ataques adversariais
        run: npm run pm:evidence:intake:audit
      - name: Auditar runbook privado PM e dossies P0 sem aprovacoes
        run: npm run pm:private:p0:audit
      - name: Auditar preflight de piloto por ativo e qualidade metrologica
        run: npm run pm:pilot:preflight:audit
      - name: Auditar segregacao das decisoes FMEA, SAP e operacao
        run: npm run pm:review:decision:audit
      - name: Auditar prontidao documental e 35 posicoes de investigacao P0
        run: npm run pm:p0:investigation:audit
      - name: Auditar triagem sequencial P0 e bloqueios de aplicabilidade
        run: npm run pm:p0:staged-triage:audit
      - name: Reconciliar 25 regras PM, caminhos SAP e códigos funcionais compartilhados
        run: npm run pm:functional:reconcile:audit
      - name: Auditar pacotes de curadoria documental por familia funcional PM
        run: npm run pm:functional:review-queue:audit
      - name: Auditar cinco P0 e quinze diagnosticos diferenciais com contraprovas
        run: npm run pm:p0:discrimination:audit
      - name: Auditar blueprint de recebimento e custodia de dois pilotos P0
        run: npm run pm:p0:evidence:pilot:audit
      - name: Simular evidencias insuficientes conflitantes invalidas e favoraveis nos pilotos P0
        run: npm run pm:p0:scenarios:audit
      - name: Auditar prontidao corporativa e oito gates privados de homologacao
        run: npm run pm:corporate:readiness:audit
      - name: Auditar pacote SEC-01 patrocínio licença OEM e privacidade sem homologacao
        run: npm run pm:sec01:approval:audit
      - name: Auditar RACI proposto e registro de decisoes privadas SEC-01 sem atribuir signatarios
        run: npm run pm:sec01:handoff:audit
      - name: Auditar memorando SEC-01 e triagem de respostas corporativas sinteticas
        run: npm run pm:sec01:request:audit
      - name: Auditar observabilidade e hipoteses alternativas de 15 regras PM sem prioridade documental
        run: npm run pm:unranked:observability:audit
      - name: Auditar detectabilidade e inconclusao de 15 metodos de inspecao PM
        run: npm run pm:inspection:detectability:audit
      - name: Auditar qualidade metrologica e custodia de evidencias sinteticas PM
        run: npm run pm:metrology:provenance:audit
      - name: Auditar matriz integrada de maturidade da evidencia e bloqueios causais PM
        run: npm run pm:evidence:maturity:audit
      - name: Validar 10 bloqueios PM e 7 requisitos de efetividade OEM D9
        run: npm run pm:exceptions:validate
      - name: Gerar vínculos diagnósticos por modelo
        run: npm run diagnostic:generate
      - name: Validar vínculos, hipóteses e evidências planejadas
        run: npm run diagnostic:validate
      - name: Gerar prévia didática sem gabarito
        run: npm run diagnostic:preview
      - name: Validar ontologia e classificacoes
        run: npm run ontology:validate
      - name: Validar condicoes acoes danos e regressao semantica
        run: npm run semantics:validate
      - name: Validar cadeias causais e fontes
        run: npm run causal:validate
      - name: Validar 24 pares de efeitos locais e sistemicos
        run: npm run effects:validate
      - name: Validar 48 requisitos de evidencia e 24 gates de curadoria
        run: npm run evidence:validate
      - name: Validar protocolo de custodia restrita e 29 cenarios sinteticos
        run: npm run evidence:restricted:validate
      - name: Validar arquitetura corporativa e 42 testes sinteticos de seguranca
        run: npm run infrastructure:restricted:validate
      - name: Verificar plano de homologacao de staging e 52 testes sinteticos
        run: npm run staging:acceptance:validate
      - name: Validar contrato de adaptador offline e 56 regressões sinteticas
        run: npm run staging:adapter:validate
      - name: Verificar custodia privada e 48 atestacoes criptograficas sinteticas
        run: npm run custody:results:validate
      - name: Validar triagem de excecoes e 64 historicos sinteticos
        run: npm run staging:exceptions:validate
      - name: Validar catalogo de remediacao e 52 regressoes sinteticas
        run: npm run remediation:recurrence:validate
      - name: Consolidar oito bloqueios com 40 testes sinteticos de procedencia
        run: npm run blockers:validate
      - name: Conferir sete requisicoes D9 e 35 cenarios sinteticos
        run: npm run d9:oem:request:validate
      - name: Validar cinco fontes CAT publicas e 31 regressoes D9
        run: npm run d9:public:oem:validate
      - name: Conferir issue publica D9 e 27 controles de handoff
        run: npm run d9:handoff:validate
      - name: Validar capacidade discriminante de seis testes P0
        run: npm run discrimination:validate
      - name: Validar avaliacao cruzada de 24 testes e revisao SAP/OEM
        run: npm run differential:validate
      - name: Validar três roteiros diferenciais e causalidade segregada
        run: npm run pathways:validate
      - name: Validar tres novos roteiros e 21 regressões diagnosticas
        run: npm run pathways:expand:validate
      - name: Verificar seis playbooks aprofundados e 34 regressões
        run: npm run playbooks:deepdives:validate
      - name: Validar 12 playbooks, crosswalk causal e 46 regressões
        run: npm run playbooks:remaining:validate
      - name: Revisar cinco lacunas e 21 regressões de promoção causal
        run: npm run causal:gaps:validate
      - name: Auditar ontologia de 3 propostas e 18 mutacoes sinteticas
        run: npm run taxonomy:proposals:validate
      - name: Validar conceito de perda interna e 3 submodos de engrenagem
        run: npm run mechanisms:refinements:validate
      - name: Validar quatro niveis causais em 24 cadeias
        run: npm run causal:levels:validate
      - name: Auditar causalidade sistemica em 24 cadeias
        run: npm run systemic:audit:validate
      - name: Gerar preview publico versionado
        run: npm run public:export
      - name: Validar preview publico e checksum
        run: npm run public:validate
      - name: Verificar contrato publico e compatibilidade SemVer
        run: npm run public:compatibility
      - name: Verificar release de conteudo e golden snapshot
        run: npm run public:content:validate
      - name: Testar 17 mutacoes sinteticas de compatibilidade de conteudo
        run: npm run public:content:test
      - name: Auditar 24 cadeias contra locais componentes danos e causas SAP
        run: npm run causal:sap:audit
      - name: Gerar relatorio de cobertura e lacunas
        run: npm run quality:audit
      - name: Publicar pacotes para testes
        uses: actions/upload-artifact@v4
        with:
          name: failure-candidates-${{ github.sha }}
          path: |
            data/models/*.json
            data/manifest.json
            data/knowledge/pm-prevention/generated-links.json
            data/knowledge/diagnostic/generated-links.json
            data/knowledge/diagnostic/generated-player-preview.json
            reports/quality-audit.generated.json
            reports/causal-sap-audit.generated.json
            reports/pm-gap-audit.generated.json
            reports/pm-functional-boundaries.generated.json
            reports/pm-filtration-discovery.generated.json
            reports/pm-vpar-provenance.generated.json
            reports/pm-vpar-evidence-matrix.generated.json
            reports/pm-semantic-triage.generated.json
            reports/pm-engine-oil-filter-scope.generated.json
            reports/pm-idler-scope.generated.json
            reports/pm-idler-roller-semantics.generated.json
            reports/pm-semantic-crosswalk.generated.json
            reports/pm-cooling-fan-ontology.generated.json
            reports/pm-hose-abrasion.generated.json
            reports/pm-track-bolt.generated.json
            reports/pm-final-drive-gear.generated.json
            reports/pm-final-drive-bearing.generated.json
            reports/pm-differential-gear.generated.json
            reports/pm-implement-cylinder.generated.json
            reports/pm-brake-disc.generated.json
            reports/pm-exhaust-preflight.generated.json
            reports/pm-exhaust-ontology.generated.json
            reports/pm-tire-damage.generated.json
            reports/pm-tire-wear.generated.json
            reports/pm-drill-feed.generated.json
            reports/pm-drill-rotary.generated.json
            reports/pm-drill-pressure.generated.json
            reports/pm-drill-filter.generated.json
            reports/pm-maturity.generated.json
            reports/pm-evidence-intake.generated.json
            reports/pm-private-p0.generated.json
            reports/pm-pilot-preflight.generated.json
            reports/pm-review-decision.generated.json
            reports/pm-p0-investigation.generated.json
            reports/pm-p0-staged-triage.generated.json
            reports/pm-functional-reconciliation.generated.json
            reports/pm-functional-review-workpacks.generated.json
            reports/pm-p0-discriminative-evidence.generated.json
            reports/pm-p0-evidence-pilot-blueprints.generated.json
            reports/pm-p0-synthetic-evidence-outcomes.generated.json
            reports/pm-corporate-readiness-closure.generated.json
            reports/pm-sec01-approval-brief.generated.json
            reports/pm-sec01-governance-handoff.generated.json
            reports/pm-sec01-decision-request.generated.json
            reports/pm-unranked-observability.generated.json
            reports/pm-inspection-detectability.generated.json
            reports/pm-metrology-provenance.generated.json
            reports/pm-evidence-maturity.generated.json
            reports/sec01-corporate-request.generated.md
            reports/public-knowledge.v1.json
            reports/public-manifest.v1.json
            data/governance/public-content-releases.v1.json
          retention-days: 14
