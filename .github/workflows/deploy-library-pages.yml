name: Publicar Biblioteca Técnica no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/quality/fundamentals-retrieval-golden.v1.json'
      - 'scripts/lib/fundamentals-retrieval.mjs'
      - 'scripts/query-fundamentals.mjs'
      - 'scripts/audit-fundamentals-retrieval.mjs'
      - 'data/knowledge/functional-architecture.v1.json'
      - 'data/quality/fundamentals-unseen-challenge.v1.json'
      - 'docs/arquitetura-funcional.html'
      - 'scripts/build-functional-architecture.mjs'
      - 'scripts/audit-functional-architecture.mjs'
      - 'scripts/audit-fundamentals-unseen-challenge.mjs'
      - 'scripts/lib/technical-discovery-v2.mjs'
      - 'scripts/build-technical-search-v2.mjs'
      - 'scripts/query-technical-v2.mjs'
      - 'scripts/audit-technical-search-v2.mjs'
      - 'docs/consulta-tecnica.html'
      - 'scripts/lib/external-review-core.mjs'
      - 'scripts/evaluate-external-review.mjs'
      - 'scripts/build-external-review-lab.mjs'
      - 'scripts/audit-external-review.mjs'
      - 'docs/laboratorio-avaliacao.html'
      - 'docs/AVALIACAO_INDEPENDENTE_PROTOCOLO.md'
      - 'schemas/external-review-batch.v1.schema.json'
      - 'data/quality/external-review-empty-template.v1.json'
      - 'scripts/lib/dual-review-core.mjs'
      - 'scripts/reconcile-blind-reviews.mjs'
      - 'scripts/build-dual-review-workflow.mjs'
      - 'scripts/audit-dual-review-workflow.mjs'
      - 'docs/coleta-perguntas.html'
      - 'docs/revisao-cega.html'
      - 'docs/adjudicacao-tecnica.html'
      - 'docs/AVALIACAO_DUPLA_REVISAO.md'
      - '.gitignore'
      - 'docs/piloto-oficina.html'
      - 'docs/PILOTO_QUESTIONARIO_OFICINA.md'
      - 'data/quality/field-pilot-readiness.v1.json'
      - 'scripts/audit-field-pilot.mjs'
      - 'scripts/lib/dual-review-core.mjs'
      - 'scripts/reconcile-blind-reviews.mjs'
      - 'scripts/evaluate-external-review.mjs'
      - 'docs/controle-piloto.html'
      - 'scripts/lib/pilot-readiness-core.mjs'
      - 'scripts/build-pilot-gates.mjs'
      - 'scripts/check-pilot-gates.mjs'
      - 'scripts/audit-pilot-gates.mjs'
      - 'docs/CICLO_2026-11-08_CONTROLE_EXECUCAO_PILOTO.md'
      - 'docs/biblioteca-tecnica.html'
      - 'schemas/technical-knowledge-record.v2.schema.json'
      - 'scripts/build-fundamentals-portal.mjs'
      - 'scripts/audit-foundational-research.mjs'
      - 'docs/fundamentos-hidraulica-tribologia.html'
      - 'docs/fontes-tecnicas.html'
      - 'data/research/sources.v1.json'
      - 'data/catalog/source-discovery.v1.json'
      - 'data/catalog/knowledge-index.v1.json'
      - 'data/knowledge/fundamentals/**'
      - 'docs/mapa-semantico.html'
      - 'scripts/build-semantic-atlas.mjs'
      - 'scripts/audit-technical-knowledge-record.mjs'
      - 'schemas/technical-knowledge-record.schema.json'
      - 'data/catalog/technical-glossary.v1.json'
      - 'data/catalog/source-discovery.v1.json'
      - 'data/catalog/repository-inventory-snapshot.v1.json'
      - 'docs/glossario-tecnico.html'
      - 'docs/fontes-tecnicas.html'
      - 'docs/inventario-acervo.html'
      - 'scripts/audit-knowledge-discovery.mjs'
      - 'llms.txt'
      - 'index.html'
      - 'docs/index.html'
      - '.github/workflows/deploy-library-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-technical-library
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify library files
        run: |
          test -s docs/biblioteca-tecnica.html
          test -s data/catalog/knowledge-index.v1.json
          test -s llms.txt
          node scripts/audit-knowledge-index.mjs
          node scripts/audit-knowledge-discovery.mjs
          node scripts/build-semantic-atlas.mjs
          node scripts/audit-technical-knowledge-record.mjs
          node scripts/build-fundamentals-portal.mjs
          node scripts/audit-foundational-research.mjs
          node scripts/audit-fundamentals-retrieval.mjs
          node scripts/build-functional-architecture.mjs
          node scripts/audit-functional-architecture.mjs
          node scripts/audit-fundamentals-unseen-challenge.mjs
          node scripts/build-technical-search-v2.mjs
          node scripts/audit-technical-search-v2.mjs
          node scripts/build-external-review-lab.mjs
          node scripts/evaluate-external-review.mjs
          node scripts/audit-external-review.mjs
          node scripts/build-dual-review-workflow.mjs
          node scripts/reconcile-blind-reviews.mjs
          node scripts/audit-dual-review-workflow.mjs
          node scripts/audit-field-pilot.mjs
          node scripts/build-pilot-gates.mjs
          node scripts/audit-pilot-gates.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp docs/biblioteca-tecnica.html _site/index.html
          cp reports/fundamentos-hidraulica-tribologia.generated.html _site/fundamentos-hidraulica-tribologia.html
          cp reports/fundamentals.generated.json _site/fundamentos-tecnicos.v1.json
          cp reports/fundamentals-retrieval-baseline.generated.json _site/fundamentals-retrieval-baseline.v1.json
          cp reports/arquitetura-funcional.generated.html _site/arquitetura-funcional.html
          cp reports/functional-architecture.generated.json _site/arquitetura-funcional.v1.json
          cp reports/fundamentals-uncalibrated-challenge.generated.json _site/fundamentals-uncalibrated-challenge.v1.json
          cp reports/consulta-tecnica.generated.html _site/consulta-tecnica.html
          cp reports/technical-search-v2-bundle.generated.json _site/technical-search-v2-bundle.v1.json
          cp reports/technical-search-v2-report.generated.json _site/technical-search-v2-report.v1.json
          cp reports/laboratorio-avaliacao.generated.html _site/laboratorio-avaliacao.html
          cp schemas/external-review-batch.v1.schema.json _site/external-review-batch.v1.schema.json
          cp data/quality/external-review-empty-template.v1.json _site/external-review-empty-template.v1.json
          cp reports/external-review-evaluation.generated.json _site/external-review-status.v1.json
          cp reports/coleta-perguntas.generated.html _site/coleta-perguntas.html
          cp reports/revisao-cega.generated.html _site/revisao-cega.html
          cp reports/adjudicacao-tecnica.generated.html _site/adjudicacao-tecnica.html
          cp reports/dual-review-public-status.generated.json _site/dual-review-status.v1.json
          cp docs/piloto-oficina.html _site/piloto-oficina.html
          cp data/quality/field-pilot-readiness.v1.json _site/field-pilot-readiness.v1.json
          cp reports/field-pilot-readiness-audit.generated.json _site/field-pilot-audit.v1.json
          cp reports/controle-piloto.generated.html _site/controle-piloto.html
          cp reports/pilot-gates-bundle.generated.json _site/pilot-gates-bundle.v1.json
          cp reports/pilot-gates-public-status.generated.json _site/pilot-gates-public-status.v1.json
          cp reports/pilot-gates-audit.generated.json _site/pilot-gates-audit.v1.json
          cp schemas/technical-knowledge-record.v2.schema.json _site/technical-knowledge-record.v2.schema.json
          cp reports/mapa-semantico.generated.html _site/mapa-semantico.html
          cp reports/semantic-atlas.generated.json _site/semantic-atlas.v1.json
          cp data/knowledge/fundamentals/hydraulic-inlet-restriction.v1.json _site/technical-record-hydraulic-inlet.v1.json
          cp docs/biblioteca-tecnica.html _site/biblioteca-tecnica.html
          cp docs/glossario-tecnico.html _site/glossario-tecnico.html
          cp docs/fontes-tecnicas.html _site/fontes-tecnicas.html
          cp docs/inventario-acervo.html _site/inventario-acervo.html
          cp data/catalog/technical-glossary.v1.json _site/technical-glossary.v1.json
          cp data/catalog/source-discovery.v1.json _site/source-discovery.v1.json
          cp data/catalog/repository-inventory-snapshot.v1.json _site/repository-inventory-snapshot.v1.json
          cp data/catalog/knowledge-index.v1.json _site/knowledge-index.v1.json
          cp llms.txt _site/llms.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
