name: Knowledge library QA
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'llms.txt'
      - 'skills/consultar-acervo-manutencao/**'
      - 'docs/AI_RETRIEVAL_CONTRACT.md'
      - 'docs/KNOWLEDGE_PLATFORM_ARCHITECTURE.md'
      - 'docs/ROADMAP_TECNICO_2026_2027.md'
      - 'data/quality/fundamentals-retrieval-golden.v1.json'
      - 'scripts/lib/fundamentals-retrieval.mjs'
      - 'scripts/query-fundamentals.mjs'
      - 'scripts/audit-fundamentals-retrieval.mjs'
      - 'data/knowledge/functional-architecture.v1.json'
      - 'data/quality/fundamentals-unseen-challenge.v1.json'
      - 'docs/arquitetura-funcional.html'
      - 'scripts/build-functional-architecture.mjs'
      - 'scripts/audit-functional-architecture.mjs'
      - 'scripts/audit-fundamentals-unseen-challenge.mjs'
      - 'scripts/lib/technical-discovery-v2.mjs'
      - 'scripts/build-technical-search-v2.mjs'
      - 'scripts/query-technical-v2.mjs'
      - 'scripts/audit-technical-search-v2.mjs'
      - 'docs/consulta-tecnica.html'
      - 'scripts/lib/external-review-core.mjs'
      - 'scripts/evaluate-external-review.mjs'
      - 'scripts/build-external-review-lab.mjs'
      - 'scripts/audit-external-review.mjs'
      - 'docs/laboratorio-avaliacao.html'
      - 'docs/AVALIACAO_INDEPENDENTE_PROTOCOLO.md'
      - 'schemas/external-review-batch.v1.schema.json'
      - 'data/quality/external-review-empty-template.v1.json'
      - 'scripts/lib/dual-review-core.mjs'
      - 'scripts/reconcile-blind-reviews.mjs'
      - 'scripts/build-dual-review-workflow.mjs'
      - 'scripts/audit-dual-review-workflow.mjs'
      - 'docs/coleta-perguntas.html'
      - 'docs/revisao-cega.html'
      - 'docs/adjudicacao-tecnica.html'
      - 'docs/AVALIACAO_DUPLA_REVISAO.md'
      - '.gitignore'
      - 'docs/piloto-oficina.html'
      - 'docs/PILOTO_QUESTIONARIO_OFICINA.md'
      - 'data/quality/field-pilot-readiness.v1.json'
      - 'scripts/audit-field-pilot.mjs'
      - 'scripts/lib/dual-review-core.mjs'
      - 'scripts/reconcile-blind-reviews.mjs'
      - 'scripts/evaluate-external-review.mjs'
      - 'docs/controle-piloto.html'
      - 'scripts/lib/pilot-readiness-core.mjs'
      - 'scripts/build-pilot-gates.mjs'
      - 'scripts/check-pilot-gates.mjs'
      - 'scripts/audit-pilot-gates.mjs'
      - 'docs/CICLO_2026-11-08_CONTROLE_EXECUCAO_PILOTO.md'
      - 'docs/biblioteca-tecnica.html'
      - 'schemas/technical-knowledge-record.v2.schema.json'
      - 'scripts/build-fundamentals-portal.mjs'
      - 'scripts/audit-foundational-research.mjs'
      - 'docs/fundamentos-hidraulica-tribologia.html'
      - 'docs/fontes-tecnicas.html'
      - 'data/research/sources.v1.json'
      - 'data/catalog/source-discovery.v1.json'
      - 'data/catalog/knowledge-index.v1.json'
      - 'data/catalog/technical-glossary.v1.json'
      - 'data/catalog/source-discovery.v1.json'
      - 'data/catalog/repository-inventory-snapshot.v1.json'
      - 'docs/glossario-tecnico.html'
      - 'docs/fontes-tecnicas.html'
      - 'docs/inventario-acervo.html'
      - 'scripts/audit-knowledge-discovery.mjs'
      - 'scripts/query-knowledge-index.mjs'
      - 'scripts/audit-knowledge-index.mjs'
      - 'scripts/build-semantic-atlas.mjs'
      - 'scripts/audit-technical-knowledge-record.mjs'
      - 'docs/mapa-semantico.html'
      - 'data/knowledge/fundamentals/**'
      - 'schemas/technical-knowledge-record.schema.json'
      - 'package.json'
      - '.github/workflows/knowledge-library.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run knowledge:catalog:audit
      - run: npm run knowledge:discovery:audit
      - run: npm run knowledge:atlas:build
      - run: npm run knowledge:technical:audit
      - run: npm run knowledge:fundamentals:build
      - run: npm run knowledge:fundamentals:audit
      - run: npm run knowledge:retrieval:audit
      - run: npm run knowledge:functional:build
      - run: npm run knowledge:functional:audit
      - run: npm run knowledge:challenge:audit
      - run: npm run knowledge:search:v2:build
      - run: npm run knowledge:search:v2:audit
      - run: npm run knowledge:external:build
      - run: npm run knowledge:external:status
      - run: npm run knowledge:external:audit
      - run: npm run knowledge:dual:build
      - run: npm run knowledge:dual:status
      - run: npm run knowledge:dual:audit
      - run: npm run knowledge:pilot:audit
      - run: npm run knowledge:pilot:build
      - run: npm run knowledge:pilot:gates:audit
      - run: npm run knowledge:pilot:gates
      - run: npm run knowledge:search:v2 -- --query "piloto hidráulico não aciona a válvula"
      - run: npm run knowledge:fundamentals:query -- --query "fadiga de contato"
      - run: node --check scripts/query-knowledge-index.mjs
      - run: npm run knowledge:query -- --query cavitacao
